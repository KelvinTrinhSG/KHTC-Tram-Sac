<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kế hoạch thi công trạm sạc</title>
<style>
  :root { --bg:#eef0f3; --panel:#fff; --text:#1d2433; --muted:#6b7385; --accent:#0b6bcb; --line:#dde1e8; --page-bg:#525659; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#14171c; --panel:#1d2128; --text:#e6e9ef; --muted:#9aa3b2; --accent:#5aa9ff; --line:#2e343e; --page-bg:#2a2d33; }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--page-bg); color:var(--text);
    font-family:"Segoe UI", system-ui, -apple-system, sans-serif; }
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap;
    padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); box-shadow:0 1px 4px rgba(0,0,0,.12); }
  h1 { font-size:16px; margin:0; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .tab { border:1px solid var(--line); background:transparent; color:var(--text);
    padding:7px 14px; border-radius:6px; cursor:pointer; font-size:14px; font-family:inherit; }
  .tab[aria-selected="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .tools { margin-left:auto; display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); }
  .tools button { border:1px solid var(--line); background:transparent; color:var(--text);
    width:30px; height:30px; border-radius:6px; cursor:pointer; font-size:16px; }
  .tools a { color:var(--accent); text-decoration:none; margin-left:8px; }
  .tools a:hover { text-decoration:underline; }
  html, body { overflow:hidden; }
  #pages { display:flex; flex-direction:column; align-items:flex-start; gap:12px; padding:16px; overflow:auto;
    cursor:grab; touch-action:pan-x pan-y; overscroll-behavior:contain; }
  #pages.drag { cursor:grabbing; user-select:none; }
  #pages canvas { display:block; flex:none; margin:0 auto; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.35); }
  #status { color:#e6e9ef; padding:40px 16px; text-align:center; }
  @media (max-width:600px) { .tools { margin-left:0; width:100%; } }
</style>
</head>
<body>
<header>
  <h1>Kế hoạch thi công trạm sạc</h1>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="tools">
    <button id="zoomOut" title="Thu nhỏ">−</button>
    <span id="zoomLbl">100%</span>
    <button id="zoomIn" title="Phóng to">+</button>
  </div>
</header>
<div id="status">Đang tải tài liệu…</div>
<div id="pages"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const docs = [
    { name: "Bình Triệu", file: "261119 KHTC TRạm Sạc BìnH TRIệu.pdf" },
    { name: "Gia Định", file: "261119 KHTC Trạm Trung Chuyển Xanh CV Gia Định.pdf" },
    { name: "Biên Hòa", file: "261119 KHTC Trạm Sạc Biên Hòa.pdf" },
    { name: "An Sương", file: "261119 KHTC Trạm Sạc An Sương.pdf" },
    { name: "Dĩ An", file: "261119 KHTC Trạm Sạc Dĩ An.pdf" },
    { name: "Bình Tân", file: "261119 KHTC Trạm Sạc Bình Tân (SR An Lạc).pdf" },
    { name: "Thuận An", file: "261119 KHTC Trạm Sạc Thuận An.pdf" }
  ];
  const $ = id => document.getElementById(id);
  let rt;
  const tabs = $("tabs"), pagesEl = $("pages"), statusEl = $("status");
  let current = -1, pdf = null, zoom = 1, renderToken = 0;

  function show(i) {
    if (i === current) return;
    current = i;
    const url = encodeURIComponent(docs[i].file);
    document.title = docs[i].name + " · Kế hoạch thi công";
    [...tabs.children].forEach((b, j) => b.setAttribute("aria-selected", j === i));
    history.replaceState(null, "", "#" + i);
    pagesEl.innerHTML = ""; statusEl.textContent = "Đang tải tài liệu…"; statusEl.hidden = false;
    pdfjsLib.getDocument(url).promise.then(p => { pdf = p; statusEl.hidden = true; render(); })
      .catch(() => { statusEl.textContent = "Không hiển thị được tài liệu. Vui lòng tải lại trang."; });
  }

  function fitHeight() {
    pagesEl.style.height = Math.max(240, innerHeight - pagesEl.getBoundingClientRect().top) + "px";
  }

  // vẽ lại theo mức zoom, giữ nguyên điểm đang xem ở giữa khung
  async function render() {
    if (!pdf) return;
    const token = ++renderToken;
    fitHeight();
    const el = pagesEl, had = el.querySelector("canvas") !== null;
    const cx = had ? (el.scrollLeft + el.clientWidth / 2) / el.scrollWidth : 0.5;
    const cy = had ? (el.scrollTop + el.clientHeight / 2) / el.scrollHeight : 0;
    $("zoomLbl").textContent = Math.round(zoom * 100) + "%";
    const avail = Math.min(el.clientWidth - 32, 1600);
    const dpr = window.devicePixelRatio || 1;
    const pages = [];
    for (let n = 1; n <= pdf.numPages; n++) {
      const page = await pdf.getPage(n);
      if (token !== renderToken) return;
      const scale = (avail / page.getViewport({ scale: 1 }).width) * zoom;
      const vp = page.getViewport({ scale: scale * dpr });
      const c = document.createElement("canvas");
      c.width = vp.width; c.height = vp.height;
      c.style.width = (vp.width / dpr) + "px"; c.style.height = (vp.height / dpr) + "px";
      pages.push([page, vp, c]);
    }
    el.replaceChildren(...pages.map(p => p[2]));
    el.scrollLeft = cx * el.scrollWidth - el.clientWidth / 2;
    el.scrollTop = cy * el.scrollHeight - el.clientHeight / 2;
    for (const [page, vp, c] of pages) {
      if (token !== renderToken) return;
      await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    }
  }

  // kéo chuột để di chuyển (pan); trên điện thoại vuốt một ngón là di chuyển
  let drag = null;
  pagesEl.addEventListener("pointerdown", e => {
    if (e.pointerType !== "mouse" || e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, l: pagesEl.scrollLeft, t: pagesEl.scrollTop };
    pagesEl.classList.add("drag"); pagesEl.setPointerCapture(e.pointerId);
  });
  pagesEl.addEventListener("pointermove", e => {
    if (!drag) return;
    pagesEl.scrollLeft = drag.l - (e.clientX - drag.x);
    pagesEl.scrollTop = drag.t - (e.clientY - drag.y);
  });
  const endDrag = () => { drag = null; pagesEl.classList.remove("drag"); };
  pagesEl.addEventListener("pointerup", endDrag);
  pagesEl.addEventListener("pointercancel", endDrag);
  // Ctrl + lăn chuột để phóng to / thu nhỏ
  pagesEl.addEventListener("wheel", e => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    zoom = Math.min(3, Math.max(0.5, zoom + (e.deltaY < 0 ? 0.25 : -0.25)));
    clearTimeout(rt); rt = setTimeout(render, 120);
  }, { passive: false });

  docs.forEach((d, i) => {
    const b = document.createElement("button");
    b.className = "tab"; b.setAttribute("role", "tab"); b.textContent = d.name;
    b.onclick = () => show(i);
    tabs.appendChild(b);
  });
  $("zoomIn").onclick = () => { zoom = Math.min(zoom + 0.25, 3); render(); };
  $("zoomOut").onclick = () => { zoom = Math.max(zoom - 0.25, 0.5); render(); };
  pagesEl.addEventListener("contextmenu", e => e.preventDefault());
  addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 250); });

  const start = parseInt(location.hash.slice(1), 10);
  show(start >= 0 && start < docs.length ? start : 0);
</script>
</body>
</html>
